[project]
name = "banking-transaction-analytics"
version = "0.1.0"
description = "Import, validate, normalize, deduplicate and analyze bank-statement transactions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20",
    "asyncpg>=0.32",
    "fastapi>=0.115",
    "pydantic-settings>=2.16",
    "sqlalchemy[asyncio]>=2.1",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "pytest>=8.3",
    "pytest-asyncio>=1.4",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transaction_analytics"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a real PostgreSQL (TEST_DATABASE_URL); run with `make test-integration`",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
# A deprecation fails the run instead of scrolling past (the lock pins versions, so this only
# trips on a deliberate upgrade). Starlette, FastAPI and Uvicorn subclass UserWarning, not
# DeprecationWarning, so they are named explicitly (tests/unit/test_warning_filters.py).
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    "error::starlette.exceptions.StarletteDeprecationWarning",
    "error::fastapi.exceptions.FastAPIDeprecationWarning",
    "error::uvicorn.config.UvicornDeprecationWarning",
]
